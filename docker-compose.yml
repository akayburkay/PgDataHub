services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATAHUB_DB_NAME:-pgdatahub}
      POSTGRES_USER: ${PGDATAHUB_DB_USER:-pgdatahub}
      POSTGRES_PASSWORD: ${PGDATAHUB_DB_PASSWORD:-change-this-db-password}
    volumes:
      - pgdatahub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  pgdatahub:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGDATAHUB_DB_HOST: db
      PGDATAHUB_DB_PORT: 5432
      PGDATAHUB_DB_NAME: ${PGDATAHUB_DB_NAME:-pgdatahub}
      PGDATAHUB_DB_USER: ${PGDATAHUB_DB_USER:-pgdatahub}
      PGDATAHUB_DB_PASSWORD: ${PGDATAHUB_DB_PASSWORD:-change-this-db-password}
      PGDATAHUB_ADMIN_KEY: ${PGDATAHUB_ADMIN_KEY:-change-this-admin-key}
    ports:
      - "127.0.0.1:${PGDATAHUB_PORT:-5270}:8080"
    volumes:
      - pgdatahub_config:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  pgdatahub_postgres:
  pgdatahub_config:
