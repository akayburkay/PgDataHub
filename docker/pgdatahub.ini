[database]
host=db
port=5432
database=pgdatahub
user=pgdatahub
password=change-this-db-password
minPoolSize=5
maxPoolSize=100
commandTimeout=30

[collections]
include=*
exclude=

[feature]
defaultLimit=1000
maxLimit=10000

[function]
include=*
exclude=
defaultTimeout=30
maxRows=10000

[auth]
enabled=true
defaultRole=
adminRole=admin

[auth.apikey]
enabled=true
header=X-API-Key

[auth.jwt]
enabled=false
authority=
audience=
roleClaim=roles

[role.admin]
description=Full access
collections.allow=*
collections.deny=
functions.allow=*
functions.deny=
