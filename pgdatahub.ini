[database]
host=localhost
port=5432
database=geotest
user=postgres
password=123
minPoolSize=5
maxPoolSize=100
commandTimeout=30

[collections]
include=*
exclude=audit_*

[feature]
defaultLimit=1000
maxLimit=10000

[function]
include=api_*
exclude=public.api_buildings()
defaultTimeout=30
maxRows=10000

[public.map_buildings.feature]
allow=id,name,address,geom
hide=internal_notes

[public.map_users.feature]
hide=password,email,phone

[public.map_parcels.feature]
hide=geom