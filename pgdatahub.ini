[database]
host=localhost
port=5432
database=my_database
user=postgres
password=your_password
minPoolSize=5
maxPoolSize=100
commandTimeout=30

[collections]
include=*
exclude=audit_*

[feature]
defaultLimit=1000
maxLimit=10000

[function]
include=*
exclude=
volatileInclude=
defaultTimeout=30
maxRows=10000

# Per-table configuration
[public.buildings.feature]
hide=internal_notes

# Authentication & authorization (disabled by default).
# When enabled, every endpoint requires a valid API key or JWT and access is
# scoped by role. Roles, permissions and API keys are stored in THIS ini file
# (the [role.*] and [apikey.*] sections below) and managed from the /admin UI.
[auth]
enabled=false
# Role applied to requests with no credentials. Empty = anonymous denied (401).
defaultRole=
# Role required to use the /admin UI and /auth/* management endpoints.
adminRole=admin

[auth.apikey]
enabled=true
header=X-API-Key

[auth.jwt]
enabled=false
authority=https://idp.example.com/realms/main
audience=pgdatahub
roleClaim=roles

# === Auth data (managed by PgDataHub — manual edits here may be overwritten) ===

[role.admin]
description=Full access
collections.allow=*
functions.allow=*

[role.readonly]
description=Public cities only, population hidden
collections.allow=public.cities
columns.public.cities.hide=population

# Example admin key. Raw key: admin-key-123 (change in production!)
[apikey.1]
name=admin key
owner=ops
description=
hash=6aa3a7254fc8538cc5107f4b86874317f68b1541ca0e7251766cf276510d78e9
role=admin
enabled=true
expires=
lastUsed=