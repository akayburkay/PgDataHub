[database]
host=localhost
port=5432
database=my_database
user=postgres
password=your_password
minPoolSize=5
maxPoolSize=100
commandTimeout=30

[collections]
include=*
exclude=audit_*

[feature]
defaultLimit=1000
maxLimit=10000

[function]
include=*
exclude=
defaultTimeout=30
maxRows=10000

# Per-table configuration
[public.buildings.feature]
hide=internal_notes